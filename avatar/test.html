<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lip Sync Analyzer — Test</title>
  <style>
    :root {
      --bg:      #0d0d0f;
      --panel:   #14151a;
      --card:    #1a1b22;
      --border:  #28293a;
      --accent:  #00d4ff;
      --warm:    #ff6b35;
      --text:    #e8eaf0;
      --sub:     #6b6f88;
      --active-bg: rgba(0,212,255,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 9px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    header a  { color: var(--sub); font-size: .8rem; text-decoration: none; }
    header a:hover { color: var(--accent); }

    /* ── Input bar ── */
    #input-bar {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    #phrase-input {
      flex: 1; resize: none;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: .93rem; line-height: 1.4;
      min-height: 54px;
    }
    #phrase-input:focus { outline: none; border-color: var(--accent); }

    .btn {
      padding: 8px 15px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
      font-size: .85rem; cursor: pointer; white-space: nowrap;
    }
    .btn:hover  { background: #242533; }
    .btn.prime  { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .btn.prime:hover { background: #00b8e0; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn.playing  { background: rgba(255,107,53,.15); border-color: var(--warm); color: var(--warm); }

    /* ── Main two-column area ── */
    #main {
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: hidden;
    }

    /* ── Left: avatar canvas ── */
    #canvas-wrap {
      position: relative;
      background: #09090f;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    #avatar-canvas { width: 100%; height: 100%; display: block; }
    #loading-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(9,9,15,.75); color: var(--sub); font-size: .8rem;
      pointer-events: none;
    }

    /* ── Right panel ── */
    #right {
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* Current segment info */
    #info-panel {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .section-label {
      font-size: .7rem; color: var(--sub);
      text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: 8px;
    }
    #cur-word  { font-size: 2rem; font-weight: 800; color: var(--accent); min-height: 2.4rem; }
    #cur-syl   { font-size: .82rem; color: var(--sub); margin-top: 1px; min-height: 1rem; }
    #phoneme-row {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 8px; min-height: 26px;
    }
    .pchip {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 7px;
      background: #1a1b22; border: 1px solid var(--border); border-radius: 4px;
      font-size: .78rem; font-family: monospace;
    }
    .pchip .pv { color: var(--accent); font-weight: 700; margin-left: 1px; }
    #cur-vis-big {
      font-size: 2.6rem; font-weight: 900; color: var(--warm);
      line-height: 1; margin-top: 6px; min-height: 3.2rem;
    }
    #vis-desc { font-size: .78rem; color: var(--sub); margin-top: 2px; }

    /* Morph bars */
    #morph-section {
      overflow-y: auto; padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .mrow  { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .mlbl  { width: 18px; font-size: .78rem; font-weight: 700; font-family: monospace; color: var(--sub); text-align: right; }
    .mlbl.on { color: var(--accent); }
    .mtrack { flex: 1; height: 7px; background: #1e2030; border-radius: 4px; overflow: hidden; }
    .mfill  { height: 100%; background: var(--accent); border-radius: 4px; width: 0%; }
    .mfill.warm { background: var(--warm); }
    .mval  { width: 34px; font-size: .72rem; font-family: monospace; color: var(--sub); text-align: right; }

    /* Transport */
    #transport {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      padding: 8px 18px;
      background: var(--panel);
    }
    .sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
    #status { margin-left: auto; font-size: .78rem; color: var(--sub); }
    #kbd-hint { width: 100%; font-size: .68rem; color: var(--sub); margin-top: 2px; }

    /* ── Bottom: Timeline ── */
    #timeline-section {
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex; flex-direction: column;
      height: 185px; flex-shrink: 0;
    }
    #tl-header {
      padding: 7px 18px 4px;
      font-size: .7rem; color: var(--sub);
      text-transform: uppercase; letter-spacing: .1em; flex-shrink: 0;
    }
    #timeline {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 4px 18px 10px;
      overflow-x: auto; flex: 1;
    }
    #timeline::-webkit-scrollbar { height: 4px; }
    #timeline::-webkit-scrollbar-track { background: var(--bg); }
    #timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .wcard {
      flex-shrink: 0; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; cursor: pointer;
      min-width: 72px; max-width: 190px;
      transition: border-color .12s;
    }
    .wcard:hover  { border-color: #444660; }
    .wcard.active { border-color: var(--accent); background: var(--active-bg); }
    .wcard.done   { opacity: .45; }
    .wc-txt { font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wc-vis { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
    .vbadge {
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      font-size: .72rem; font-weight: 700; font-family: monospace; color: var(--sub);
    }
    .vbadge.lit { background: var(--active-bg); border-color: var(--accent); color: var(--accent); }
    .wc-bar  { height: 2px; background: #222336; border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .wc-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
    .wc-dur  { font-size: .65rem; color: var(--sub); margin-top: 3px; }
    .wc-dur span { color: var(--accent); }
    .wc-syls { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--border); }
    .schip {
      padding: 2px 5px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      font-size: .7rem; cursor: pointer;
    }
    .schip:hover { border-color: var(--warm); color: var(--warm); }
    .schip .sv { font-weight: 700; color: var(--sub); margin-left: 2px; }
    .schip.slit { border-color: var(--warm); color: var(--warm); }
    .schip.slit .sv { color: var(--warm); }

    #tl-empty { color: var(--sub); font-size: .83rem; margin: auto; }
  </style>
</head>
<body>

<header>
  <h1>🎙 Lip Sync Analyzer</h1>
  <a href="/">← Avatar</a>
  <a href="/viseme-test.html">Viseme Test</a>
</header>

<div id="input-bar">
  <textarea id="phrase-input" rows="2"
    placeholder="Type a phrase and click Analyze…"
  >Good evening. Welcome to the broadcast. I am your news presenter.</textarea>
  <button class="btn prime" id="btn-analyze">Analyze</button>
  <button class="btn" id="btn-play" disabled>▶ Play</button>
  <button class="btn" id="btn-stop" disabled>⏹ Stop</button>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="avatar-canvas"></canvas>
    <div id="loading-overlay">Loading avatar…</div>
  </div>

  <div id="right">
    <div id="info-panel">
      <div class="section-label">Current Segment</div>
      <div id="cur-word">—</div>
      <div id="cur-syl">Analyze a phrase to begin</div>
      <div id="phoneme-row"></div>
      <div id="cur-vis-big">—</div>
      <div id="vis-desc"></div>
    </div>

    <div id="morph-section">
      <div class="section-label">Morph Targets</div>
      <div id="morph-bars"></div>
    </div>

    <div id="transport">
      <button class="btn" id="btn-first"    title="First word">|◀</button>
      <button class="btn" id="btn-prevw"    title="Prev word (←)">◀ Word</button>
      <button class="btn" id="btn-prevs"    title="Prev syllable (↑)">◀ Syl</button>
      <button class="btn" id="btn-nexts"    title="Next syllable (↓)">Syl ▶</button>
      <button class="btn" id="btn-nextw"    title="Next word (→)">Word ▶</button>
      <button class="btn" id="btn-last"     title="Last word">▶|</button>
      <div class="sep"></div>
      <button class="btn" id="btn-speak"    title="Speak current word (S)">🔊 Word</button>
      <div id="status">Ready</div>
      <div id="kbd-hint">← → words &nbsp;·&nbsp; ↑ ↓ syllables &nbsp;·&nbsp; Space play/stop &nbsp;·&nbsp; S speak word</div>
    </div>
  </div>
</div>

<div id="timeline-section">
  <div id="tl-header">Timeline — click word card to jump · click syllable chip to preview</div>
  <div id="timeline">
    <p id="tl-empty">Enter a phrase and click Analyze.</p>
  </div>
</div>

<script type="module" src="/src/syncTest.js"></script>
</body>
</html>
