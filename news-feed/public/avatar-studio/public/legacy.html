<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lip-Sync Avatar</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* ── Mobile: hide desktop panels by default, show toggle button ── */
    @media (max-width: 768px) {
      #anim-panel { display: none !important; }
      #tab-nav { display: none !important; }
      #delay-control { display: none !important; }
      #input-section {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        top: auto !important;
        padding: 0.6rem 0.8rem 1.2rem !important;
        background: rgba(8,8,24,0.96) !important;
        border-top: 1px solid #2a2a5a;
        z-index: 250;
        max-height: 50vh;
        overflow-y: auto;
        border-radius: 1rem 1rem 0 0;
        transform: translateY(calc(100% - 3rem));
        transition: transform 0.3s ease;
      }
      #input-section.expanded { transform: translateY(0); }
      #input-section::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        background: #4a4aff;
        border-radius: 2px;
        margin: 0 auto 0.4rem;
        cursor: pointer;
      }
      #pose-selects { display: none !important; }
      #input-row input { font-size: 14px !important; padding: 0.6rem 0.8rem !important; }
      #input-row button { font-size: 13px !important; padding: 0.5rem 0.8rem !important; }
      #position-controls { gap: 0.3rem !important; }
      #position-controls button { font-size: 11px !important; padding: 0.4rem 0.5rem !important; }
      .feature-toggle-row { display: none !important; }
      #status-msg { font-size: 11px !important; margin-top: 0.3rem !important; }
      .mobile-drag-handle {
        display: block;
        width: 40px;
        height: 5px;
        background: #4a4aff;
        border-radius: 3px;
        margin: 0 auto 0.5rem;
        cursor: pointer;
      }

      /* ── Mobile: show bottom tab bar ── */
      #mobile-tab-bar {
        display: flex !important;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 300;
        background: rgba(10, 10, 26, 0.96);
        border-top: 1px solid #2a2a5a;
        backdrop-filter: blur(12px);
        justify-content: space-around;
        padding: 0.3rem 0;
        padding-bottom: max(0.3rem, env(safe-area-inset-bottom, 0.3rem));
      }
      #mobile-tab-bar .mobile-tab-btn {
        flex: 1;
        text-align: center;
        padding: 0.35rem 0.2rem;
        border: none;
        background: transparent;
        color: #666;
        font-size: 0.65rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        border-radius: 0.5rem;
        margin: 0 0.2rem;
        transition: background 0.2s, color 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
      }
      #mobile-tab-bar .mobile-tab-btn .tab-icon {
        font-size: 1.2rem;
      }
      #mobile-tab-bar .mobile-tab-btn.active {
        color: #fff;
        background: rgba(74,74,255,0.25);
      }
      #mobile-tab-bar .mobile-tab-btn:active {
        background: rgba(74,74,255,0.15);
      }

      /* ── Mobile: news brief panel positioned from bottom ── */
      #brief-panel {
        left: 0.5rem !important;
        right: 0.5rem !important;
        top: auto !important;
        bottom: 3.5rem !important;
        transform: none !important;
        width: auto !important;
        max-height: 60vh !important;
        border-radius: 0.75rem !important;
      }
    }

    /* Desktop: hide mobile toggle and mobile tab bar */
    @media (min-width: 769px) {
      .mobile-toggle { display: none !important; }
      #mobile-tab-bar { display: none !important; }
    }

    #tab-nav {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      gap: 0.4rem;
      background: rgba(10, 10, 26, 0.88);
      border: 1px solid #2a2a5a;
      border-radius: 2rem;
      padding: 0.3rem;
      backdrop-filter: blur(12px);
    }
    .tab-link {
      padding: 0.4rem 1.3rem;
      border-radius: 1.5rem;
      border: none;
      background: transparent;
      color: #888;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
    }
    .tab-link.active { background: #4a4aff; color: #fff; }
    .tab-link:hover:not(.active) { background: rgba(74,74,255,0.2); color: #ccc; }

    #anim-panel {
      position: fixed;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      background: rgba(8, 8, 24, 0.94);
      border: 1px solid #2a2a5a;
      border-radius: 1rem;
      padding: 0.75rem 0.8rem;
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 230px;
      max-height: 88vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #2a2a5a transparent;
    }
    #anim-panel::-webkit-scrollbar { width: 4px; }
    #anim-panel::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 2px; }
    .anim-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5a5aff;
      text-align: center;
      margin-bottom: 0.1rem;
    }
    .anim-section { display: flex; flex-direction: column; gap: 0.28rem; }
    .anim-label {
      font-size: 0.6rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }
    .anim-row { display: flex; gap: 0.28rem; }
    .anim-btn {
      flex: 1;
      padding: 0.35rem 0.2rem;
      border-radius: 0.45rem;
      border: 1px solid #2a2a5a;
      background: rgba(255,255,255,0.04);
      color: #999;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-family: inherit;
      white-space: nowrap;
      text-align: center;
    }
    .anim-btn:hover  { background: rgba(74,74,255,0.22); border-color: #4a4aff; color: #fff; }
    .anim-btn.active { background: rgba(74,74,255,0.32); border-color: #7a7aff; color: #fff; }
    .anim-divider { height: 1px; background: #1e1e3a; margin: 0.05rem 0; }
    .ps-tabs { display: flex; gap: 0.18rem; margin-bottom: 0.08rem; }
    .ps-tab {
      flex: 1;
      padding: 0.28rem 0.1rem;
      border-radius: 0.38rem;
      border: 1px solid #1a1a36;
      background: transparent;
      color: #444;
      font-size: 0.62rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .ps-tab:hover:not(.active) { background: rgba(74,74,255,0.1); color: #888; border-color: #2a2a5a; }
    .ps-tab.active { background: rgba(74,74,255,0.28); border-color: #5a5aff; color: #ddf; }
    .arm-tabs { display: flex; gap: 0.25rem; }
    .arm-tab {
      flex: 1;
      padding: 0.32rem 0.2rem;
      border-radius: 0.4rem;
      border: 1px solid #2a2a5a;
      background: transparent;
      color: #555;
      font-size: 0.67rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .arm-tab.active { background: rgba(74,74,255,0.3); border-color: #5a5aff; color: #ccc; }
    .arm-tab:hover:not(.active) { background: rgba(74,74,255,0.12); color: #888; }
    .ctrl-row { display: flex; align-items: center; gap: 0.35rem; }
    .ctrl-name { font-size: 0.6rem; color: #666; width: 54px; flex-shrink: 0; white-space: nowrap; }
    .ctrl-slider { flex: 1; height: 3px; accent-color: #5a5aff; cursor: pointer; }
    .ctrl-val { font-size: 0.62rem; color: #5a5aff; font-weight: 700; width: 30px; text-align: right; flex-shrink: 0; }
    #delay-control { position: fixed; bottom: 1rem; right: 1.2rem; z-index: 200; display: flex; align-items: center; gap: 0.6rem; background: rgba(10, 10, 26, 0.88); border: 1px solid #2a2a5a; border-radius: 2rem; padding: 0.4rem 1rem; backdrop-filter: blur(12px); }
    #delay-control label { font-size: 0.75rem; color: #888; white-space: nowrap; }
    #main-delay-slider { width: 100px; accent-color: #ff6b6b; cursor: pointer; height: 4px; }
    #main-delay-label { font-size: 0.82rem; font-weight: 700; color: #ff9a9a; min-width: 3em; text-align: right; }
    .feature-toggle-row { display: flex; justify-content: center; margin-top: 0.35rem; }
    .feature-toggle { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.74rem; color: #9aa; background: rgba(255,255,255,0.05); border: 1px solid #2a2a5a; border-radius: 999px; padding: 0.3rem 0.6rem; user-select: none; }
    .feature-toggle input { accent-color: #5a5aff; cursor: pointer; }
    #position-controls { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
    #position-controls button { flex: 1; padding: 0.55rem 0.8rem; border-radius: 0.75rem; border: 1px solid #2a2a5a; background: rgba(255,255,255,0.06); color: #ddd; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
    #position-controls button:hover { background: rgba(74,74,255,0.22); border-color: #4a4aff; color: #fff; }
    #pose-selects { display: flex; gap: 0.45rem; margin-bottom: 0.5rem; justify-content: center; }
    .pose-quick-sel { flex: 1; max-width: 140px; padding: 0.38rem 0.5rem; border-radius: 0.5rem; border: 1px solid #3a3aaa; background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.75rem; font-family: inherit; cursor: pointer; outline: none; }
    .pose-quick-sel:focus { border-color: #8080ff; }
    .pose-quick-sel option { background: #0a0a1a; color: #ccc; }
    .ps-ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.22rem; margin-bottom: 0.1rem; }
    .ctrl-joint-btn { padding: 0.3rem 0.15rem; border-radius: 0.4rem; border: 1px solid #2a2a5a; background: rgba(255,255,255,0.04); color: #aaa; font-size: 0.6rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.12s, border-color 0.12s, color 0.12s; text-align: center; }
    .ctrl-joint-btn:hover:not([disabled]) { background: rgba(74,74,255,0.22); border-color: #4a4aff; color: #fff; }
    .ctrl-joint-btn[disabled] { opacity: 0.2; cursor: not-allowed; }
    .ctrl-joint-btn.ghost { border-color: #1a1a36; background: transparent; color: #444; }
    .ctrl-joint-btn.ghost:hover { background: rgba(74,74,255,0.1); color: #888; border-color: #2a2a5a; }
    .ctrl-joint-btn.span-2 { grid-column: span 2; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="anim-panel">
    <div class="anim-title">Pose Studio</div>
    <div class="ps-tabs">
      <button class="ps-tab active" data-part="R">R. Hand</button>
      <button class="ps-tab"        data-part="L">L. Hand</button>
      <button class="ps-tab"        data-part="H">Head</button>
    </div>
    <div class="ps-panel" id="ps-panel-L" style="display:none">
      <div class="ps-section">
        <div class="ps-label">Select Joint</div>
        <div class="joint-list">
          <div class="jl-row">
            <button class="joint-btn" data-bone="DEF-upper_armL" data-part="L">Shoulder</button>
            <button class="joint-btn" data-bone="DEF-forearmL"   data-part="L">Elbow</button>
            <button class="joint-btn" data-bone="DEF-handL"      data-part="L">Wrist</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Thumb</span>
            <button class="joint-btn seg" data-bone="DEF-thumb01L"   data-part="L">Base</button>
            <button class="joint-btn seg" data-bone="DEF-thumb02L"   data-part="L">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-thumb03L"   data-part="L">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Index</span>
            <button class="joint-btn seg" data-bone="DEF-f_index01L"  data-part="L">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_index02L"  data-part="L">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_index03L"  data-part="L">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Middle</span>
            <button class="joint-btn seg" data-bone="DEF-f_middle01L" data-part="L">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_middle02L" data-part="L">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_middle03L" data-part="L">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Ring</span>
            <button class="joint-btn seg" data-bone="DEF-f_ring01L"   data-part="L">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_ring02L"   data-part="L">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_ring03L"   data-part="L">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Pinky</span>
            <button class="joint-btn seg" data-bone="DEF-f_pinky01L"  data-part="L">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_pinky02L"  data-part="L">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_pinky03L"  data-part="L">Tip</button>
          </div>
        </div>
      </div>
      <div class="anim-divider"></div>
      <div class="ps-section">
        <div class="ps-label">Rotate: <span id="ps-selected-name-L">— select —</span></div>
        <div class="ps-ctrl-grid">
          <button class="ctrl-joint-btn" id="ps-up-L">▲</button>
          <button class="ctrl-joint-btn" id="ps-down-L">▼</button>
          <button class="ctrl-joint-btn" id="ps-left-L">◄</button>
          <button class="ctrl-joint-btn" id="ps-right-L">►</button>
          <button class="ctrl-joint-btn" id="ps-rollin-L">↺</button>
          <button class="ctrl-joint-btn" id="ps-rollout-L">↻</button>
          <button class="ctrl-joint-btn ghost span-2" id="ps-reset-joint-L">● Reset</button>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-name">Step</span>
          <input type="range" class="ctrl-slider" id="ps-step-L" min="1" max="30" value="5">
          <span class="ctrl-val" id="ps-step-val-L">5°</span>
        </div>
      </div>
      <div class="anim-divider"></div>
      <div class="ps-section">
        <div class="ps-label">Saved Poses</div>
        <div class="ps-save-row">
          <input class="ps-name-input" type="text" id="ps-pose-name-L" placeholder="Pose name…" maxlength="30">
          <button class="ps-btn" id="ps-save-pose-L">Save</button>
        </div>
        <div id="ps-pose-list-L"></div>
      </div>
    </div>
    <div class="ps-panel" id="ps-panel-H" style="display:none">
      <div class="ps-section">
        <div class="ps-label">Head Rotation</div>
        <div class="ps-ctrl-grid">
          <button class="ctrl-joint-btn" id="ps-up-H">▲ Look Up</button>
          <button class="ctrl-joint-btn" id="ps-down-H">▼ Look Dn</button>
          <button class="ctrl-joint-btn" id="ps-left-H">◄ Turn L</button>
          <button class="ctrl-joint-btn" id="ps-right-H">Turn R ►</button>
          <button class="ctrl-joint-btn" id="ps-rollin-H" style="display:none">↺</button>
          <button class="ctrl-joint-btn" id="ps-rollout-H" style="display:none">↻</button>
          <button class="ctrl-joint-btn ghost span-2" id="ps-reset-joint-H">● Reset</button>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-name">Step</span>
          <input type="range" class="ctrl-slider" id="ps-step-H" min="1" max="30" value="5">
          <span class="ctrl-val" id="ps-step-val-H">5°</span>
        </div>
      </div>
      <div class="anim-divider"></div>
      <div class="ps-section">
        <div class="ps-label">Saved Poses</div>
        <div class="ps-save-row">
          <input class="ps-name-input" type="text" id="ps-pose-name-H" placeholder="Pose name…" maxlength="30">
          <button class="ps-btn" id="ps-save-pose-H">Save</button>
        </div>
        <div id="ps-pose-list-H"></div>
      </div>
    </div>
    <div class="ps-panel" id="ps-panel-R">
      <div class="ps-section">
        <div class="ps-label">Select Joint</div>
        <div class="joint-list">
          <div class="jl-row">
            <button class="joint-btn" data-bone="DEF-upper_armR" data-part="R">Shoulder</button>
            <button class="joint-btn" data-bone="DEF-forearmR"   data-part="R">Elbow</button>
            <button class="joint-btn" data-bone="DEF-handR"      data-part="R">Wrist</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Thumb</span>
            <button class="joint-btn seg" data-bone="DEF-thumb01R"   data-part="R">Base</button>
            <button class="joint-btn seg" data-bone="DEF-thumb02R"   data-part="R">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-thumb03R"   data-part="R">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Index</span>
            <button class="joint-btn seg" data-bone="DEF-f_index01R"  data-part="R">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_index02R"  data-part="R">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_index03R"  data-part="R">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Middle</span>
            <button class="joint-btn seg" data-bone="DEF-f_middle01R" data-part="R">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_middle02R" data-part="R">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_middle03R" data-part="R">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Ring</span>
            <button class="joint-btn seg" data-bone="DEF-f_ring01R"   data-part="R">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_ring02R"   data-part="R">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_ring03R"   data-part="R">Tip</button>
          </div>
          <div class="jl-finger"><span class="jlf-lbl">Pinky</span>
            <button class="joint-btn seg" data-bone="DEF-f_pinky01R"  data-part="R">Base</button>
            <button class="joint-btn seg" data-bone="DEF-f_pinky02R"  data-part="R">Mid</button>
            <button class="joint-btn seg" data-bone="DEF-f_pinky03R"  data-part="R">Tip</button>
          </div>
        </div>
      </div>
      <div class="anim-divider"></div>
      <div class="ps-section">
        <div class="ps-label">Rotate: <span id="ps-selected-name-R">— select —</span></div>
        <div class="ps-ctrl-grid">
          <button class="ctrl-joint-btn" id="ps-up-R">▲</button>
          <button class="ctrl-joint-btn" id="ps-down-R">▼</button>
          <button class="ctrl-joint-btn" id="ps-left-R">◄</button>
          <button class="ctrl-joint-btn" id="ps-right-R">►</button>
          <button class="ctrl-joint-btn" id="ps-rollin-R">↺</button>

        </div>
        <div class="ctrl-row">
          <span class="ctrl-name">Step</span>
          <input type="range" class="ctrl-slider" id="ps-step-R" min="1" max="30" value="5">
          <span class="ctrl-val" id="ps-step-val-R">5°</span>

      </div>
      <div class="anim-divider"></div>
      <div class="ps-section">
        <div class="ps-label">Saved Poses</div>

          <input class="ps-name-input" type="text" id="ps-pose-name-R" placeholder="Pose name…" maxlength="30">
          <button class="ps-btn" id="ps-save-pose-R">Save</button>
        </div>
        <div id="ps-pose-list-R"></div>
      </div>
    </div>
  </div>
  <!-- Desktop tab nav -->
  <nav id="tab-nav">
    <a href="./legacy.html" class="tab-link active" data-tab="avatar">Avatar</a>
    <a href="./legacy.html" class="tab-link" data-tab="news-brief">News Brief</a>
    <a href="./test.html" class="tab-link" data-tab="lipsync">Lip-Sync Lab</a>
  </nav>
  <!-- Mobile bottom tab bar -->
  <nav id="mobile-tab-bar">
    <button class="mobile-tab-btn active" data-tab="avatar">
      <span class="tab-icon">🧑</span>
      <span>Avatar</span>
    </button>
    <button class="mobile-tab-btn" data-tab="news-brief">
      <span class="tab-icon">📺</span>
      <span>Brief</span>
    </button>
    <button class="mobile-tab-btn" data-tab="lipsync">
      <span class="tab-icon">🎤</span>
      <span>Lab</span>

  <main id="app">
    <section id="input-section">
      <div class="mobile-drag-handle" id="mobile-handle"></div>
      <div id="pose-selects">
        <select id="pose-quick-R" class="pose-quick-sel"><option value="">— R. Hand pose —</option></select>
        <select id="pose-quick-L" class="pose-quick-sel"><option value="">— L. Hand pose —</option></select>
        <select id="pose-quick-H" class="pose-quick-sel"><option value="">— Head pose —</option></select>
      </div>
      <div id="input-row">
        <input
          type="text"
          id="text-input"
          placeholder="Type something for the avatar to say…"
          autocomplete="off"
        />
        <button id="speak-btn" disabled>Speak</button>
        <button id="replay-btn" disabled title="Replay the last speech without re-synthesising">↻</button>
      </div>
      <div class="feature-toggle-row">
        <label class="feature-toggle" for="emotion-toggle-main">
          <input id="emotion-toggle-main" type="checkbox" />
          Emotion Hands + News Tone
        </label>
      </div>
      <div id="position-controls" style="flex-wrap:wrap">
        <button id="character-left">◀ Left</button>
        <button id="character-raise">▲ Up</button>
        <button id="character-right">Right ▶</button>
        <button id="character-lower">▼ Down</button>
        <button id="character-forward">Forward ▲</button>
        <button id="character-back">Back ▼</button>
        <button id="character-save" style="flex-basis:100%">Save Position</button>
      </div>
      <p id="status-msg"></p>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
  <script type="module">
    // ── Tab Switching ──────────────────────────────────────────────
    import { initNewsBriefUI, handleNewsBriefMessage, abortNewsBrief } from './news-brief.js';
    import { handleAvatarPositionMessage } from './avatar-position.js';

    // Find elements
    const tabNav = document.getElementById('tab-nav');
    const mobileTabBar = document.getElementById('mobile-tab-bar');
    const animPanel = document.getElementById('anim-panel');
    const inputSection = document.getElementById('input-section');
    const delayControl = document.getElementById('delay-control');

    // Create news-brief panel in the same position as anim-panel
    const briefPanel = document.createElement('div');
    briefPanel.id = 'brief-panel';
    briefPanel.style.cssText = `
      position: fixed; left: 1.2rem; top: 50%; transform: translateY(-50%);
      z-index: 200; background: rgba(8, 8, 24, 0.94);
      border: 1px solid #2a2a5a; border-radius: 1rem;
      backdrop-filter: blur(14px);
      width: 260px; max-height: 88vh; overflow-y: auto;
      display: none; /* hidden by default */
    `;
    document.body.appendChild(briefPanel);

    // Initialize News Brief UI inside the panel
    initNewsBriefUI(briefPanel);

    // Tab switching
    function switchTab(tabName) {
      // Update active state on desktop tabs
      document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab-link[data-tab="${tabName}"]`)?.classList.add('active');

      // Update active state on mobile tabs
      document.querySelectorAll('.mobile-tab-btn').forEach(el => el.classList.remove('active'));
      document.querySelector(`.mobile-tab-btn[data-tab="${tabName}"]`)?.classList.add('active');

      // Show/hide panels
      const isAvatar = tabName === 'avatar';
      const isBrief = tabName === 'news-brief';
      const isLipsync = tabName === 'lipsync';

      animPanel.style.display = isAvatar ? '' : 'none';
      briefPanel.style.display = isBrief ? '' : 'none';
      inputSection.style.display = isAvatar ? '' : 'none';
      delayControl.style.display = isAvatar ? '' : 'none';

      // If leaving news-brief, abort any running operation
      if (!isBrief) {
        abortNewsBrief();
      }
    }

    // Listen for desktop tab clicks
    tabNav.addEventListener('click', (e) => {
      const tabLink = e.target.closest('.tab-link');
      if (!tabLink) return;
      e.preventDefault();
      const tab = tabLink.dataset.tab;
      if (tab === 'lipsync') {
        window.location.href = './test.html';
        return;
      }
      switchTab(tab);
    });

    // Listen for mobile tab clicks
    mobileTabBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.mobile-tab-btn');
      if (!btn) return;
      const tab = btn.dataset.tab;
      if (tab === 'lipsync') {
        window.location.href = './test.html';
        return;
      }
      switchTab(tab);
    });

    function handleHostMessage(event) {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data.type === 'switch-tab' && data.tab) {
          switchTab(data.tab);
          return;
        }
        if (handleAvatarPositionMessage(data)) {
          return;
        }
      } catch (_) { /* non-JSON, ignore */ }

      handleNewsBriefMessage(event);
    }

    // React Native WebView (iOS) + iframe parent
    window.addEventListener('message', handleHostMessage);
    // React Native WebView (Android)
    document.addEventListener('message', handleHostMessage);

    // Also forward from parent if needed
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'news-brief', action: 'ready' }, '*');
    }
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'avatar-position', action: 'ready' }));
    }
  </script>
  <div id="delay-control">
    <label for="main-delay-slider">Sync&nbsp;Delay</label>
    <input id="main-delay-slider" type="range" min="0" max="2" step="0.05" value="0.1" />
    <span id="main-delay-label">0.10s</span>
  </div>
</body>
