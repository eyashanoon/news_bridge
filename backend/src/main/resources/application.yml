spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/news_crawler?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:news_user}
    password: ${DB_PASSWORD:news_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:adamqobbajtv@gmail.com}
    password: ${MAIL_PASSWORD:mvih padc laxo xmzx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    jwt:
      secret: ${JWT_SECRET:change-this-jwt-secret-in-production-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ}
      expiration: ${JWT_EXPIRATION:86400000}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  mail:
    dev-log-only: ${MAIL_DEV_LOG_ONLY:false}
  bootstrap:
    owner-email: owner@news.local
    owner-password: change-me
    crawler-email: ${CRAWLER_EMAIL:crawler-service@news.local}
    crawler-password: ${CRAWLER_PASSWORD:secure-crawler-password-change-me}

crawler:
  server:
    base-url: ${CRAWLER_SERVER_BASE_URL:http://127.0.0.1:8000}

telegram-crawler:
  server:
    base-url: ${TELEGRAM_CRAWLER_BASE_URL:http://localhost:8200}

tag:
  service:
    base-url: ${TAG_SERVICE_BASE_URL:http://localhost:8001}

wayback:
  api:
    cdx-url: ${WAYBACK_CDX_URL:https://web.archive.org/cdx/search/cdx}

verification:
  mbfc-ratings-url: ${VERIFICATION_MBFC_URL:https://raw.githubusercontent.com/drmikecrowe/mbfcext/main/docs/v3/combined.json}
  opensources-url: ${VERIFICATION_OPENSOURCES_URL:https://raw.githubusercontent.com/BigMcLargeHuge/opensources/master/sources/sources.json}
  tranco-api-url: ${VERIFICATION_TRANCO_URL:https://tranco-list.eu/api/ranks/domain}

endpoint-discovery:
  server:
    base-url: ${ENDPOINT_DISCOVERY_BASE_URL:http://localhost:8004}
  max-depth: ${ENDPOINT_DISCOVERY_MAX_DEPTH:2}

server:
  error:
    include-stacktrace: always
    include-message: always